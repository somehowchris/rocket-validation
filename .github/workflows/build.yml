name: test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

jobs:
  test-native:
    name: Build and Test on native hardware
    strategy:
      fail-fast: false
      matrix:
        # Exercise every supported host on stable; compiler-channel coverage
        # runs on Linux rather than repeating it across all hosts.
        include:
          - toolchain: stable
            node: ubuntu-latest
          - toolchain: stable
            node: windows-latest
          - toolchain: stable
            node: macos-latest
          - toolchain: beta
            node: ubuntu-latest
          - toolchain: nightly
            node: ubuntu-latest
          - toolchain: 1.88.0 # msrv
            node: ubuntu-latest
    runs-on: ${{ matrix.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true

      - uses: Swatinem/rust-cache@v2.7.3

      - name: Test Dev
        run: cargo test --all-features --workspace

      - name: Test Release
        run: cargo test --release  --all-features --workspace

  check-cross:
    name: Build and Test for foreign hardware via cross
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
        config:
          # linux aarch64 incl android
          - node: ubuntu-latest
            arch: aarch64-linux-android
          - node: ubuntu-latest
            arch: aarch64-unknown-linux-gnu
          - node: ubuntu-latest
            arch: aarch64-unknown-linux-musl

          # linux x86
          - node: ubuntu-latest
            arch: x86_64-linux-android
          - node: ubuntu-latest
            arch: x86_64-unknown-linux-gnu
          - node: ubuntu-latest
            arch: x86_64-unknown-linux-musl

          # windows aarch64
          - node: windows-latest
            arch: aarch64-pc-windows-msvc
          - node: windows-latest
            arch: x86_64-pc-windows-msvc

          # apple aarch64
          - node: macos-latest
            arch: aarch64-apple-ios
          - node: macos-latest
            arch: aarch64-apple-ios-sim
          - node: macos-latest
            arch: x86_64-apple-ios
          - node: macos-latest
            arch: aarch64-apple-darwin

    runs-on: ${{ matrix.config.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Docker-based cross builds are supported on Linux runners only.
      - name: Set up Docker Buildx
        if: runner.os == 'Linux' && !contains(matrix.config.arch, 'android')
        uses: docker/setup-buildx-action@v3

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.config.arch }}

      - name: Install cross
        if: runner.os == 'Linux' && !contains(matrix.config.arch, 'android')
        run: cargo install cross --locked

      - name: Test Linux targets
        if: runner.os == 'Linux' && !contains(matrix.config.arch, 'android')
        run: cross test --target ${{ matrix.config.arch }} --all-features --workspace --examples

      - name: Check Apple and Windows targets
        if: runner.os != 'Linux' || contains(matrix.config.arch, 'android')
        run: cargo check --target ${{ matrix.config.arch }} --all-features --workspace --examples
